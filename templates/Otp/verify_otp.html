<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification | BioGrow</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (CDN for standalone UI) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen relative overflow-hidden font-sans">

    <!-- Decorative background elements -->
    <div
        class="absolute top-0 right-0 w-96 h-96 bg-emerald-500 rounded-full blur-[120px] opacity-20 -mr-20 -mt-20 pointer-events-none">
    </div>
    <div
        class="absolute bottom-0 left-0 w-80 h-80 bg-teal-500 rounded-full blur-[100px] opacity-20 -ml-20 -mb-20 pointer-events-none">
    </div>

    <div
        class="bg-white rounded-[2.5rem] shadow-[0_20px_60px_rgba(0,0,0,0.05)] border border-gray-100 p-8 sm:p-12 relative overflow-hidden max-w-[420px] w-full z-10 m-4">
        <!-- Abstract card decoration -->
        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-emerald-500 to-teal-500"></div>

        <div class="text-center mb-8">
            <h3 class="font-display font-black text-3xl text-gray-900 tracking-tight mb-2">BioGrow</h3>
            <p class="font-bold text-gray-900 mb-1">Email Verification</p>
            <p class="text-xs font-semibold text-gray-500">
                Enter the 6-digit OTP sent to your email
            </p>
        </div>

        {% if error %}
        <div
            class="bg-red-50 border border-red-200 text-red-600 rounded-xl p-3 text-sm font-bold text-center mb-6 shadow-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-6">
            <div class="mb-4">
                <input type="text" name="otp"
                    class="w-full bg-gray-50 border-2 border-gray-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/20 text-gray-900 text-center font-black text-2xl tracking-[0.5em] rounded-2xl p-4 outline-none transition-all placeholder-gray-300"
                    placeholder="●●●●●●" maxlength="6" required>
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-4 rounded-2xl shadow-[0_8px_20px_rgba(16,185,129,0.3)] hover:-translate-y-0.5 transition-all">
                Verify OTP
            </button>
        </form>

        <div class="text-center mt-8 pt-6 border-t border-gray-100">
            <p class="text-xs font-semibold text-gray-400 mb-2">Didn't receive the OTP?</p>
            <a href="{{ url_for('resend_otp', user_id=user_id) }}"
                class="font-bold text-sm text-emerald-600 hover:text-emerald-700 transition-colors">
                Resend OTP
            </a>
        </div>
    </div>

</body>

</html>
